name: Build Windows installer

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore: ["README.md"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --disable-pip-version-check --no-input pyinstaller
        timeout-minutes: 10

      - name: Build executable
        run: >
          pyinstaller --noconfirm --clean --windowed
          --name ADBStudio
          --icon packaging/icon.ico
          --add-data "web;web"
          adb_studio.py

      - name: Bundle ADB (Google platform-tools)
        shell: pwsh
        run: |
          Invoke-WebRequest https://dl.google.com/android/repository/platform-tools-latest-windows.zip -OutFile pt.zip
          Expand-Archive pt.zip -DestinationPath dist/ADBStudio
          Test-Path dist/ADBStudio/platform-tools/adb.exe

      - name: Smoke test
        shell: pwsh
        run: |
          $p = Start-Process dist/ADBStudio/ADBStudio.exe -ArgumentList "--no-window" -PassThru
          Start-Sleep 5
          if ($p.HasExited) { throw "ADBStudio.exe exited early (code $($p.ExitCode))" }
          Stop-Process $p -Force

      - name: Version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; else v="1.0.${GITHUB_RUN_NUMBER}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" packaging/setup.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Compress-Archive dist/ADBStudio/* dist/ADB-Studio-Portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ADB-Studio-Windows
          path: |
            dist/ADB-Studio-Setup.exe
            dist/ADB-Studio-Portable.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ADB-Studio-Setup.exe
            dist/ADB-Studio-Portable.zip
