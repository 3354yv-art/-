name: Build Android AdBlock APK

on:
  push:
    paths:
      - "android-adblock/**"
      - ".github/workflows/android-adblock.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-adblock
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify blocklist sources are reachable
        continue-on-error: true
        run: |
          grep -ohE 'https://[^"]+' app/src/main/java/com/adblock/app/Blocklist.java | sort -u | while read u; do
            u=$(echo "$u" | sed 's/" *+.*//')
            echo "$(curl -s -L -m 60 -o /tmp/l.txt -w '%{http_code}' "$u") $(wc -l < /tmp/l.txt) lines  $u"
          done
          echo "hagezi lists:"
          for n in pro ultimate tif.medium popupads native.xiaomi native.samsung native.huawei native.oppo-realme native.vivo; do
            echo "$(curl -s -L -m 60 -o /tmp/l.txt -w '%{http_code}' https://raw.githubusercontent.com/hagezi/dns-blocklists/main/hosts/$n.txt) $(wc -l < /tmp/l.txt) lines  $n"
          done

      - name: Core tests (unit)
        run: |
          SRC=app/src/main/java/com/adblock/app
          mkdir -p /tmp/out
          javac -Xlint:all -d /tmp/out $SRC/{DnsCore,DnsEngine,PacketHandler,Forwarder,ListParser,DomainSet}.java tests/UnitTests.java tests/Bridge.java
          java -cp /tmp/out com.adblock.app.UnitTests

      - name: Core tests (end-to-end over a real tun device)
        continue-on-error: true
        run: sudo python3 tests/e2e_tun.py /tmp/out

      # מפתח חתימה קבוע בין בניות (נשמר ב-cache, לא בריפו), כך שהעדכון מותקן מעל הגרסה הקודמת
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: ~/adblock-signing
          key: adblock-signing-v1

      - name: Create signing key if missing
        run: |
          mkdir -p ~/adblock-signing
          if [ ! -f ~/adblock-signing/release.keystore ]; then
            PASS=$(openssl rand -hex 16)
            keytool -genkeypair -keystore ~/adblock-signing/release.keystore -storepass "$PASS" -keypass "$PASS" \
              -alias adblock -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=AdBlock"
            printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=adblock\nkeyPassword=%s\n' \
              "$HOME/adblock-signing/release.keystore" "$PASS" "$PASS" > ~/adblock-signing/keystore.properties
          fi
          cp ~/adblock-signing/keystore.properties keystore.properties

      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk AdBlock.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AdBlock-apk
          path: android-adblock/AdBlock.apk

      - name: Publish to the "adblock-android" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view adblock-android >/dev/null 2>&1 || \
            gh release create adblock-android --title "AdBlock for Android" \
              --notes "Latest APK build of android-adblock/. Download AdBlock.apk and install it."
          gh release upload adblock-android AdBlock.apk --clobber
